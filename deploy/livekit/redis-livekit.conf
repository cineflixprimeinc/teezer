# Minimal Redis instance dedicated to LiveKit + Egress internal coordination
# (job dispatch between livekit-server and livekit-egress). Deliberately
# separate from the app's own Redis (which VPS2 only reaches via an SSH
# tunnel to VPS1) - see livekit.yaml.example's redis block comment.
#
# Not a cache or a queue for anything else - keep it that way. If this ever
# needs to hold more than LiveKit/Egress coordination state, that's a sign it
# should be reconsidered, not a reason to start dumping unrelated keys into it.
#
# Install: cp to /etc/redis/redis-livekit.conf, then use redis-livekit.service.

port 6400
bind 127.0.0.1 -::1
protected-mode yes
daemonize no
supervised systemd

pidfile /run/redis/redis-livekit.pid
logfile /var/log/redis/redis-livekit.log
dir /var/lib/redis-livekit

# No persistence needed - this only ever carries live, ephemeral job-dispatch
# state. If it's lost, at worst an in-flight recording job is orphaned; there
# is nothing here worth an RDB/AOF write.
save ""
appendonly no
