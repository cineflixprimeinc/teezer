# Status-conditional cache header for Next.js build assets.
#
# Install to /etc/nginx/conf.d/teezer-static-cache-map.conf (http context), then
# in the site's /_next/static/ location use:
#
#     proxy_hide_header Cache-Control;
#     add_header Cache-Control $teezer_static_cc always;
#
# WHY THIS EXISTS
#
# The site config previously hardcoded:
#
#     add_header Cache-Control "public, max-age=31536000, immutable" always;
#
# `always` applies the header to EVERY response status, errors included. On
# 2026-09-08 a rebuild that removed .next while the server was still running made
# requests return 500 for about thirty seconds; nginx stamped "cache for a year,
# immutable" onto those errors and Cloudflare stored them. The origin then served
# the files correctly while the CDN kept returning a cached 500 - and because
# /_next/static URLs are content-hashed and immutable, the entry was never
# revalidated. The homepage stayed broken behind an error boundary, and no
# server-side change could displace it: on a cache HIT the CDN never contacts the
# origin at all.
#
# A success still gets the full year, which is what keeps repeat loads fast. Only
# the error statuses change, and they must never be stored.
#
# Two other things guard the same failure, both needed:
#   - deploy/vps-deploy.sh exports NEXT_DEPLOYMENT_ID, so every deploy appends
#     ?dpl=<sha> and gets a fresh CDN cache key even if an entry is poisoned.
#   - Rebuild in place. Never `rm -rf .next` while the server is serving.

map $status $teezer_static_cc {
    default "no-store, no-cache, must-revalidate";
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
}
