# LEGACY duplicate of teezer-web.conf (plain :80, no cache headers). Kept for reference only.
# Do NOT enable it alongside teezer-web.conf - both claim teezer.live / www.teezer.live.

server {
    listen 80;
    listen [::]:80;

    server_name teezer.live www.teezer.live;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
