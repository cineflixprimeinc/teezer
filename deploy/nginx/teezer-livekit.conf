# livekit.teezer.live - installed on VPS2 (77.237.243.122), NOT VPS1.
# Same content as deploy/livekit/nginx-livekit.conf (keep the two in sync).
# Cloudflare DNS record for livekit.teezer.live must be DNS-only (grey cloud):
# WebRTC media (UDP 50000-60000, TCP 7881) goes straight to the VPS IP and cannot
# pass through the Cloudflare proxy. Cert: certbot certonly --webroot -w /var/www/html
#   -d livekit.teezer.live -m teezerlive94@gmail.com --agree-tos  (on VPS2)
#
# nginx reverse proxy for LiveKit's public WSS signaling - VPS2 only, so
# lives here in deploy/livekit/ rather than deploy/nginx/ (which is VPS1's
# web/admin/API/media vhosts). Install:
#   cp nginx-livekit.conf /etc/nginx/sites-available/livekit.conf
#   ln -s /etc/nginx/sites-available/livekit.conf /etc/nginx/sites-enabled/livekit.conf
#   nginx -t && systemctl reload nginx
#
# See README.md §3 for why this exists at all - the originally-planned
# TURN-TLS-multiplexed single-port mode (LiveKit terminating its own TLS on
# 443 directly) didn't work in testing, so this is the fallback to the
# standard, well-proven pattern: nginx terminates TLS and reverse-proxies the
# WebSocket upgrade to livekit-server's plain internal port (7880), exactly
# like every other proxied service in this repo.
server {
    listen 80;
    server_name livekit.teezer.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Plain HTTP/1.1 only, deliberately - WebSocket upgrades over HTTP/2 have
    # enough historical edge cases in nginx that it's not worth the risk for
    # a signaling connection that gains nothing from HTTP/2 multiplexing.
    listen 443 ssl;
    server_name livekit.teezer.live;

    ssl_certificate     /etc/letsencrypt/live/livekit.teezer.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.teezer.live/privkey.pem;

    # WebSocket signaling - LiveKit clients connect here (wss://).
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Signaling connections stay open for the whole call - default 60s
        # read timeout would silently kill an idle-but-connected room.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
