server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # certbot certificate covering teezer.live + subdomains (see DEPLOYMENT.md).
    # Cloudflare SSL mode must be Full (strict).
    ssl_certificate     /etc/letsencrypt/live/teezer.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teezer.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_name backend.teezer.live;

    client_max_body_size 10M;

    # Block robots and indexers
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Content-hashed build assets - safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Next.js admin panel on port 3001.
    #
    # HTML must not be cached, or a deploy never reaches the browser: the stale
    # document keeps pointing at the previous build's hashed chunk filenames.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name backend.teezer.live;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
