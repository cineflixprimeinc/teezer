# Loopback-only vhost - the actual PHP execution endpoint APISIX proxies to.
# This is the OLD teezer-api vhost's PHP-serving block, moved here verbatim
# (same root, same try_files, same fastcgi_pass to the same php-fpm socket,
# same client_max_body_size). No PHP/business logic changed - only WHERE this
# block lives moved, so APISIX has an HTTP upstream to proxy to (APISIX
# speaks HTTP, not FastCGI).
#
# Never reachable from outside this box: no TLS, no public server_name,
# bound 127.0.0.1 only. The public entrypoint is teezer-api.conf, which now
# proxies to APISIX (127.0.0.1:9080) instead of straight to this vhost.
server {
    listen 127.0.0.1:8091;
    server_name _;

    root /var/www/teezer/server/public;
    index index.php;
    client_max_body_size 100M;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ /\.env { deny all; }
    location ~ /\.ht  { deny all; }
}
