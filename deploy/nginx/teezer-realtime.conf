# realtime.teezer.live - public WebSocket entrypoint for Centrifugo (VPS1).
#
# Centrifugo listens on 127.0.0.1:8000 (deploy/centrifugo, network_mode: host).
# Only the client-facing /connection/ endpoints are exposed here. Centrifugo's
# server publish API (/api) and its admin UI (/ on :8000) must stay private -
# Laravel reaches /api over loopback - so everything else returns 404.
#
# Client URL: wss://realtime.teezer.live/connection/websocket
# Cloudflare: proxied (orange cloud) is fine - Cloudflare passes WebSockets.
#
# Install:
#   cp deploy/nginx/teezer-realtime.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/teezer-realtime.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

map $http_upgrade $teezer_realtime_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realtime.teezer.live;

    ssl_certificate     /etc/letsencrypt/live/teezer.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teezer.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/realtime-access.log;
    error_log  /var/log/nginx/realtime-error.log warn;

    location /connection/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $teezer_realtime_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived connections; Centrifugo pings every ~25s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Never expose /api (server publish API) or the admin UI.
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name realtime.teezer.live;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
