# Signed media origin for cdn.teezer.live
#
# Replaces the Cloudflare Worker. Almost every media request is validated here
# against an HMAC token minted by Laravel, then proxied to a PRIVATE Backblaze
# B2 bucket. B2 credentials never leave this box and the bucket refuses
# anonymous reads, so the only way to protected media is through a signed URL
# this file accepts. The one exception is the /public/ location below, which
# serves PublicMediaMirrorService's tokenless mirror for currently
# public+published videos - see that location's own comment for why that is
# still safe with no token at all.
#
# ── The two things that make this correct ────────────────────────────────────
#
# 1. Cloudflare is allowed to edge-cache most of these paths (see the map
#    below) - it is NOT a blanket "never cache" origin. What actually makes
#    this safe: every path still passes the secure_link_md5 check below before
#    nginx will even populate a cache entry, and every URL is a time-limited
#    CAPABILITY (an expiring token), not a viewer-bound secret - a shared cache
#    holding it for its own TTL doesn't grant access to anyone who couldn't
#    already reach it with the URL they were given. The genuinely private
#    prefixes (identity documents, DM attachments) are matched FIRST in the map
#    and forced to `private, no-store` so nothing below can ever make one
#    shared-cacheable by matching on extension instead. The one path still
#    fully private is /videos/ originals (map default) - see that branch for
#    why, and keep its TTL short if it's ever made public: VideoResource signs
#    private/draft video URLs with a 2h token vs 24h for published ones, and
#    this map can only see $uri, not that flag.
#
# 2. Segments are signed individually, because an HLS playlist references its
#    segments by RELATIVE path and the player does not carry the query string
#    across. A token on master.m3u8 alone would leave every .ts unprotected.
#    Laravel serves the playlists dynamically and writes a per-segment token
#    into each line - see HlsPlaylistController.
#
# ── Install ──────────────────────────────────────────────────────────────────
#   cp deploy/nginx/teezer-media.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/teezer-media.conf /etc/nginx/sites-enabled/
#   php artisan media:refresh-b2-token     # writes /etc/nginx/conf.d/b2_token.conf
#   nginx -t && systemctl reload nginx
#
# MEDIA_SIGNING_SECRET below must equal the app's. Keep it out of this file -
# it is read from /etc/nginx/conf.d/b2_token.conf, which is 0600 root.

# Upstream keepalive: without it every segment opens a fresh TLS session to B2,
# which on a busy feed is more time in handshakes than in transfer.
#
# __B2_DOWNLOAD_HOST__ is a PLACEHOLDER (nginx cannot take a variable in an
# upstream `server` line). It is the Teezer bucket's B2 *download* host, which
# depends on the bucket's region/cluster - e.g. f00X.backblazeb2.com. Find it as
# `downloadUrl` in b2_authorize_account for Teezer's own key, or in the
# Backblaze console (bucket -> "Friendly URL" host). deploy/nginx/install.sh
# substitutes it from the B2_DOWNLOAD_HOST env var; `nginx -t` fails loudly if
# the placeholder is left in. It must be Teezer's bucket, never Reelsoo's.
upstream teezer_b2_origin {
    server __B2_DOWNLOAD_HOST__:443;
    keepalive 32;
}

# Playlists are the takedown kill switch, so they get a short TTL; segments are
# immutable under a per-video path and get a long one. Chosen by a map because
# doing it with a nested location would silently disable proxy_pass for whatever
# it matched (see the add_header below).
map $uri $media_cache_control {
    # Order matters - nginx takes the FIRST matching entry.
    #
    # 1. Private prefixes first, so nothing below can ever make an identity
    #    document or a DM attachment shared-cacheable by matching on extension.
    ~*^/(documents|country-residency|chat)/     "private, no-store";

    # 2. HLS playlists: PUBLIC but short. The playlist is the kill switch for a
    #    takedown - playback only really stops once it stops resolving - so it
    #    must not sit at the edge for long. 5 min still absorbs a viewing burst.
    ~*\.m3u8$                                  "public, max-age=300, s-maxage=300";

    # 3. HLS segments: immutable. The path carries the video id and segment
    #    index, and a re-transcode replaces the whole directory, so a given
    #    segment URL never changes meaning.
    ~*\.ts$                                    "public, max-age=31536000, immutable";

    # 4. UUID-keyed public media. A replaced asset gets a brand-new key, so the
    #    URL is immutable by construction.
    ~*^/(hls|thumbnails|images|avatars|music)/  "public, max-age=31536000, immutable";

    # 5. The tokenless /public/ mirror (PublicMediaMirrorService, see the
    #    /public/ location below) - whatever under it isn't already caught by
    #    rules 2-3 above (i.e. the mirrored mp4 original, thumbnail, quality
    #    renditions). PublicMediaMirrorService only ever creates this prefix
    #    for a video that is CURRENTLY public+published and deletes from it
    #    the instant that stops being true, so immutable caching here carries
    #    none of rule 6's staleness concern for the signed path below.
    ~*^/public/                                 "public, max-age=31536000, immutable";

    # 6. Everything else (notably /videos/ originals - the raw mp4, used for
    #    progressive playback and as the HLS fallback while a transcode is
    #    still running) was "private, max-age=86400", which is why these never
    #    showed up as an edge cache hit (cf-cache-status: DYNAMIC on every
    #    request) and every playback round-tripped this VPS instead of the
    #    nearest edge PoP - the actual cause of slow video playback.
    #
    #    Now public, but capped at 7200s (2h), not 86400s (24h): VideoResource
    #    signs private/draft video URLs with a 2h token but published ones with
    #    24h ($ttl = $isPrivate ? 120 : 1440 minutes), and this map can only see
    #    $uri, not that flag. Caching at 24h would let a captured draft-video
    #    URL keep serving from the edge up to 22h past its intended expiry;
    #    7200s bounds that to the same order as the short TTL class while still
    #    turning most playback from a per-request VPS round-trip into an edge
    #    cache hit.
    default                                    "public, max-age=7200, s-maxage=7200";
}

# Local disk cache of B2 objects. This is NOT the CDN cache - requests still
# arrive here and are still authenticated - it only stops us re-fetching the
# same segment from B2 on every viewer, which is the whole B2 egress bill.
proxy_cache_path /var/cache/nginx/media
    levels=1:2
    keys_zone=media_cache:64m
    max_size=20g
    inactive=7d
    use_temp_path=off;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.teezer.live media.teezer.live;

    # Cloudflare origin certificate (or certbot). Terminating TLS here matters:
    # Cloudflare is in front for DDoS and TLS, but proxied - not cached.
    ssl_certificate     /etc/letsencrypt/live/teezer.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teezer.live/privkey.pem;

    # GET/HEAD/OPTIONS. Uploads go straight to B2 on a presigned URL and
    # never pass through this server - OPTIONS is admitted only for CORS
    # preflight (see each location's own handling of it below), never
    # proxied anywhere.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    access_log /var/log/nginx/media-access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/media-error.log warn;

    # ── Signature check ──────────────────────────────────────────────────────
    # secure_link_md5 must match MediaPresignService::signedCdnUrl exactly:
    #   token = base64url( md5_raw( expires . uri . secret ) )
    #
    # $remote_addr is deliberately NOT in the hash. A phone changes IP moving
    # between wifi and cellular mid-video, and binding to the address would kill
    # playback halfway through with a 403 that looks like a broken file.
    secure_link      $arg_token,$arg_expires;
    secure_link_md5  "$arg_expires$uri$media_signing_secret";

    # ── Tokenless public mirror ──────────────────────────────────────────────
    # PublicMediaMirrorService keeps a verbatim copy of a video's public-facing
    # objects (HLS tree, mp4 original, thumbnail, quality renditions) under
    # public/ for as long as - and only as long as - the video is CURRENTLY
    # public+published (see PublicMediaMirrorService::isPublic()). No
    # secure_link check at all here, on purpose: revocation is existence-based,
    # not signature-based. The moment a video stops qualifying, its mirror is
    # deleted, so a request for it genuinely 404s at origin on the very next
    # request - no per-request database check needed, no new nginx module
    # needed either. A Cloudflare purge (CloudflarePurgeService) additionally
    # clears any warm edge copy immediately once a real API token is
    # configured, but that's a latency optimisation on top of this, not the
    # safety mechanism.
    #
    # Still authenticates to B2 with the same $b2_download_token every other
    # location here uses - php artisan media:refresh-b2-token already requests
    # a whole-bucket authorization (see that command), not a path-scoped one,
    # so this needed no token-scope change. The bucket itself stays private at
    # B2's ACL level throughout; only the client-facing signature requirement
    # is dropped for this one prefix.
    #
    # `^~` wins this over the plain `location /` below for anything under
    # /public/ regardless of source order (nginx already picks the longest
    # matching prefix first; `^~` is the explicit, self-documenting version of
    # that so a future regex location can't accidentally intercept it).
    location ^~ /public/ {
        # CORS. This origin never sent Access-Control-Allow-Origin, which a
        # plain <video src> or Safari's native HLS never needed - but the
        # website's HLS engine (hls.js, frontend/src/hooks/use-hls-source.ts)
        # fetches the manifest and every segment via XHR/fetch, which DOES
        # enforce CORS. That silently forced every website playback through
        # hls.js's fatal-error-then-retry path before it fell back to plain
        # mp4 - the actual cause of "video plays slower" on the website.
        # Wildcard is safe here: everything under /public/ is deliberately
        # tokenless already (PublicMediaMirrorService only mirrors currently
        # public+published video, see this location's own comment above),
        # and auth for everything else this app does is a Bearer token, not
        # a cookie, so there is no credential a wildcard origin could leak.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        if ($request_method = OPTIONS) {
            # An `if` with its own add_header does NOT inherit the location's
            # add_header directives above (the same "only if the current
            # context sets none of its own" rule that applies between server
            # and location applies here too) - repeated rather than assumed,
            # or the preflight itself comes back with no CORS headers at all.
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_set_header Authorization $b2_download_token;
        proxy_set_header Host          __B2_DOWNLOAD_HOST__;
        proxy_set_header Range         $http_range;
        proxy_set_header If-Range      $http_if_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass https://teezer_b2_origin/file/$b2_bucket$uri;

        # Same local disk cache as the signed path (see location / below) -
        # disjoint by URI prefix, so no collision risk sharing the one zone.
        proxy_cache            media_cache;
        proxy_cache_key        "$uri";
        proxy_cache_valid      200 206 7d;
        proxy_cache_valid      404 1m;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_force_ranges on;
        proxy_buffering    on;

        proxy_hide_header Cache-Control;
        proxy_hide_header x-bz-file-id;
        proxy_hide_header x-bz-file-name;
        proxy_hide_header x-bz-upload-timestamp;
        proxy_hide_header x-bz-content-sha1;

        # Cache-Control policy lives in the shared map above - rule 5 covers
        # this prefix's mp4/thumbnail/quality objects, rules 2-3 catch its
        # .m3u8/.ts paths first (extension-only patterns, no prefix anchor).
        add_header Cache-Control $media_cache_control always;
        add_header Accept-Ranges "bytes" always;
    }

    location / {
        # CORS - see the /public/ location's own comment for why this is
        # needed at all and why a wildcard origin is safe here too. A
        # preflight doesn't carry (and shouldn't need) a valid secure_link
        # token, so OPTIONS is answered before that check even runs below -
        # the browser is only asking "is this method/header combo allowed
        # cross-origin", not making the real, signed request yet.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        if ($request_method = OPTIONS) {
            # An `if` with its own add_header does NOT inherit the location's
            # add_header directives above (the same "only if the current
            # context sets none of its own" rule that applies between server
            # and location applies here too) - repeated rather than assumed,
            # or the preflight itself comes back with no CORS headers at all.
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # secure_link is "" on a malformed token and "0" on an expired one.
        if ($secure_link = "")  { return 403 "Invalid token."; }
        if ($secure_link = "0") { return 410 "Link expired."; }

        # ── Proxy to the private bucket ──────────────────────────────────────
        # $b2_download_token is a B2 download authorization, refreshed by
        # `php artisan media:refresh-b2-token` (see that command for why a
        # download token rather than SigV4: stock nginx cannot compute SigV4,
        # and a prefix-scoped download token is the supported alternative).
        proxy_set_header Authorization $b2_download_token;
        proxy_set_header Host          __B2_DOWNLOAD_HOST__;
        proxy_set_header Range         $http_range;
        proxy_set_header If-Range      $http_if_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass https://teezer_b2_origin/file/$b2_bucket$uri;

        # ── Local cache ──────────────────────────────────────────────────────
        # Keyed on the PATH only. The token and expiry are deliberately excluded
        # so that a re-signed URL for the same object is a cache hit rather than
        # a fresh B2 fetch - otherwise every new signature would miss, and the
        # cache would never serve anything.
        proxy_cache            media_cache;
        proxy_cache_key        "$uri";
        proxy_cache_valid      200 206 7d;
        proxy_cache_valid      404 1m;
        # One request populates the entry, the rest wait for it, instead of a
        # hundred simultaneous viewers each pulling the same segment from B2.
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        # Range requests must reach B2 intact for video seeking to work.
        proxy_force_ranges on;
        proxy_buffering    on;

        # Strip anything B2 says about caching: the client-facing policy is
        # ours (see the map above), not whatever the bucket happened to return.
        proxy_hide_header Cache-Control;
        proxy_hide_header x-bz-file-id;
        proxy_hide_header x-bz-file-name;
        proxy_hide_header x-bz-upload-timestamp;
        proxy_hide_header x-bz-content-sha1;

        # Cache-Control policy lives entirely in the map above, branch by
        # branch - see it for playlists/segments/images/videos individually.
        #
        # Set from a map rather than a nested `location ~* \.m3u8$`. A nested
        # location does NOT inherit the parent's proxy_pass, so the moment one
        # matched, nginx stopped proxying and tried to serve the playlist off
        # the filesystem - every .m3u8 came back as a 404 while segments and
        # everything else worked, which reads as missing objects rather than a
        # routing mistake.
        add_header Cache-Control $media_cache_control always;
        add_header Accept-Ranges "bytes" always;
    }

    # Health check for the deploy script; no token required, touches no storage.
    location = /_health {
        access_log off;
        return 200 "ok\n";
    }
}
