server {
    server_name api.teezer.live;
    client_max_body_size 100M;

    # Public entrypoint. TLS termination is UNCHANGED (still this box's
    # Certbot cert, still nginx) - the only change from before is what
    # happens after decryption: this used to fastcgi_pass straight to
    # php-fpm (see teezer-api.conf.pre-apisix), and now proxies to APISIX
    # (127.0.0.1:9080), which makes every routing/rate-limit/CORS/security
    # decision before forwarding to teezer-api-internal.conf
    # (127.0.0.1:8091), which fastcgi_passes to the SAME php-fpm socket as
    # before. Rollback: `cp teezer-api.conf.pre-apisix
    # /etc/nginx/sites-available/teezer-api && nginx -t && systemctl reload
    # nginx`.
    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Explicit, not $server_port: without this, APISIX's own upstream
        # proxying fills in X-Forwarded-Port from ITS OWN listen port (9080)
        # rather than the port the client actually connected to, and Laravel
        # (trustProxies is configured to trust forwarded headers from any
        # hop) bakes that into every absolute URL it generates - confirmed
        # live, hls_url came back as "https://api.teezer.live:9080/...",
        # completely unreachable from the public internet. This is
        # HTTPS-only end to end (see the :80 server block below, which only
        # redirects), so 443 is always correct here.
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    location ~ /\.env { deny all; }
    location ~ /\.ht  { deny all; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/teezer.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/teezer.live/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
}
server {
    listen 80;
    listen [::]:80;
    server_name api.teezer.live;
    # Let certbot renew over HTTP-01 (webroot), redirect everything else.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
