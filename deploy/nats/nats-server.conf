# NATS JetStream server - Teezer internal event bus.
# Non-secret base config. Auth (if enabled) is injected via env in
# docker-compose.yml / nats.service - see .env.nats.example.
#
# This server is INTERNAL ONLY: it carries backend-originated interaction
# events (likes/comments/follows/shares) from the Go API's publisher to its
# own bridge consumer (see backend-go/internal/events), which then calls
# Centrifugo. No mobile/web client ever talks to NATS directly - only
# Centrifugo is client-facing. Bind to 127.0.0.1 only; never expose this
# port publicly (matches teezer-go.service's own 127.0.0.1-only posture).

host: "127.0.0.1"
port: 4222

# HTTP monitoring endpoint (localhost only) - /varz, /jsz, /connz for `nats
# server report` and quick curl health checks during deploys.
http_port: 8222

jetstream {
  store_dir: "/var/lib/nats/jetstream"
  # Generous ceilings for Phase-1 volume (8 event types, small JSON payloads);
  # the stream itself also self-bounds via MaxAge (see publisher.go).
  max_memory_store: 256MB
  max_file_store: 2GB
}

# Modest connection ceiling - this process only ever serves the local Go API
# binary(ies) on this box, never external clients.
max_connections: 64

log_file: "/var/log/nats/nats-server.log"
logtime: true
