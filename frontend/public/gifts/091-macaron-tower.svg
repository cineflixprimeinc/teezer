    <filter id="macaron-tower-f" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
