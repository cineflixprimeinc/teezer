<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes macaron-tower-sway{0%,100%{transform:rotate(-4.5deg) translateY(1px)}50%{transform:rotate(4.5deg) translateY(-2px)}}
    @keyframes macaron-tower-top{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-6deg)}}
    @keyframes macaron-tower-tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
    .macaron-tower-body{transform-box:fill-box;transform-origin:center bottom;animation:macaron-tower-sway 2.5s ease-in-out infinite}
    .macaron-tower-t{transform-box:fill-box;transform-origin:center bottom;animation:macaron-tower-top 2.5s ease-in-out infinite}
    .macaron-tower-s{transform-box:fill-box;transform-origin:center;animation:macaron-tower-tw 2.2s ease-in-out infinite}
    .macaron-tower-s2{animation-delay:.75s}
    .macaron-tower-s3{animation-delay:1.4s}
    @keyframes macaron-tower-x-lift{0%,100%{transform:translateY(1.8px) rotate(-.6deg)}50%{transform:translateY(-1.8px) rotate(.6deg)}}
    @keyframes macaron-tower-x-shine{0%{transform:translateX(-78px)}55%,100%{transform:translateX(78px)}}
    @keyframes macaron-tower-x-spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
    @keyframes macaron-tower-x-aura{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
    @keyframes macaron-tower-x-cast{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.86);opacity:.32}}
    .macaron-tower-x-lift{transform-box:fill-box;transform-origin:center;animation:macaron-tower-x-lift 3.4s ease-in-out infinite}
    .macaron-tower-x-shine{animation:macaron-tower-x-shine 4.5s cubic-bezier(.5,0,.5,1) infinite}
    .macaron-tower-x-spark{transform-box:fill-box;transform-origin:center;animation:macaron-tower-x-spark 2.2s ease-in-out infinite}
    .macaron-tower-x-aura{transform-box:fill-box;transform-origin:center;animation:macaron-tower-x-aura 3s ease-in-out infinite}
    .macaron-tower-x-cast{transform-box:fill-box;transform-origin:center;animation:macaron-tower-x-cast 3.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.macaron-tower-x-lift,.macaron-tower-x-shine,.macaron-tower-x-spark,.macaron-tower-x-aura,.macaron-tower-x-cast{animation:none}}
  </style>
  <defs>
    <linearGradient id="macaron-tower-gp" x1="10" y1="44" x2="54" y2="56" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffd0e4"/><stop offset=".5" stop-color="#ff8bbc"/><stop offset="1" stop-color="#d13d84"/>
    </linearGradient>
    <linearGradient id="macaron-tower-gg" x1="14" y1="32" x2="50" y2="42" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#d8f7c2"/><stop offset=".5" stop-color="#95dd6d"/><stop offset="1" stop-color="#4d9a2c"/>
    </linearGradient>
    <linearGradient id="macaron-tower-gy" x1="18" y1="20" x2="46" y2="30" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff3c2"/><stop offset=".5" stop-color="#ffd259"/><stop offset="1" stop-color="#dd9200"/>
    </linearGradient>
    <linearGradient id="macaron-tower-gv" x1="24" y1="10" x2="42" y2="18" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#e3d0ff"/><stop offset=".5" stop-color="#b285f5"/><stop offset="1" stop-color="#6f37cf"/>
