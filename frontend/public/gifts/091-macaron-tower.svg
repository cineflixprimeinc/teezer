        <circle cx="32" cy="7.5" r="2.6" fill="#ffd85c"/>
        </g>
        </g>
        <circle class="macaron-tower-s" cx="55" cy="18" r="2.1" fill="#fff"/>
        <circle class="macaron-tower-s macaron-tower-s2" cx="9" cy="30" r="1.7" fill="#ffd6ea"/>
        <circle class="macaron-tower-s macaron-tower-s3" cx="56" cy="36" r="1.5" fill="#fff"/>
      </g>
    </mask>
