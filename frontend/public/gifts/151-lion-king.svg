        <path d="M20 40c3 5 7 7 12 7s9-2 12-7c-1 7-6 11-12 11s-11-4-12-11Z" fill="#b06a1e" opacity=".4"/>
        <ellipse cx="27" cy="40" rx="5.5" ry="4.5" fill="#fff6e4"/><ellipse cx="37" cy="40" rx="5.5" ry="4.5" fill="#fff6e4"/>
