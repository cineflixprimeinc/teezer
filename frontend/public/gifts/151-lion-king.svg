    <circle cx="22" cy="25" r="2" fill="#8f3f0a"/><circle cx="42" cy="25" r="2" fill="#8f3f0a"/>
    <circle cx="32" cy="33" r="13.5" fill="url(#lion-king-gh)"/>
    <path d="M22 26c-2 2-3 5-3 8" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M20 40c3 5 7 7 12 7s9-2 12-7c-1 7-6 11-12 11s-11-4-12-11Z" fill="#b06a1e" opacity=".4"/>
    <ellipse cx="27" cy="40" rx="5.5" ry="4.5" fill="#fff6e4"/><ellipse cx="37" cy="40" rx="5.5" ry="4.5" fill="#fff6e4"/>
    <path d="M32 35l4 3-4 3-4-3Z" fill="#5a2a12"/>
    <path d="M32 41v3M32 44c-1 2-3 2-4 1M32 44c1 2 3 2 4 1" stroke="#5a2a12" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <ellipse cx="25" cy="31" rx="2.6" ry="3" fill="#3a1c08"/><ellipse cx="39" cy="31" rx="2.6" ry="3" fill="#3a1c08"/>
    <circle cx="26" cy="30" r="1" fill="#fff"/><circle cx="40" cy="30" r="1" fill="#fff"/>
    <path d="M25 12l2-8 4 5 1-5 1 5 4-5 2 8Z" fill="url(#lion-king-gc)"/>
