      <rect x="0" y="0" width="64" height="64" fill="url(#lion-king-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#lion-king-x-rim)"/>
      <rect class="lion-king-x-shine" x="0" y="-16" width="26" height="96" fill="url(#lion-king-x-shine-g)" transform="rotate(18 32 32)"/>
