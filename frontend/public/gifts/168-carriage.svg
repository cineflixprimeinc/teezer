        <g class="carriage-body" filter="url(#carriage-f)">
        <path d="M32 46c-11 0-19-7-19-16 0-9 8-16 19-16s19 7 19 16c0 9-8 16-19 16Z" fill="url(#carriage-c)"/>
        <path d="M32 46c9 0 16-5 18-13-1 10-9 15-18 15Z" fill="#4d1a56" opacity=".5"/>
        <path d="M32 14v32M13 30h38" stroke="url(#carriage-g)" stroke-width="2.4" fill="none"/>
        <path d="M20 17c-4 5-5 12-3 18M44 17c4 5 5 12 3 18" stroke="url(#carriage-g)" stroke-width="2" fill="none" opacity=".85"/>
        <rect x="24" y="24" width="16" height="14" rx="4" fill="#fff4d6" opacity=".85"/>
        <rect x="24" y="24" width="16" height="14" rx="4" fill="none" stroke="url(#carriage-g)" stroke-width="2.4"/>
        <path d="M27 27c-1 1.4-1.6 3-1.6 4.8" stroke="#fff" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M20 16c3-3 7-4.6 11-4.8" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M28 12h8l-4-6Z" fill="url(#carriage-g)"/>
        <circle cx="32" cy="7" r="2.4" fill="#8ee6ff"/>
        <path d="M13 46h38" stroke="url(#carriage-g)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        </g>
        <g class="carriage-w">
        <circle cx="19" cy="52" r="7" fill="none" stroke="url(#carriage-g)" stroke-width="2.6"/>
        <path d="M19 46v12M13 52h12M15 48l8 8M23 48l-8 8" stroke="url(#carriage-g)" stroke-width="1.6"/>
        <circle cx="19" cy="52" r="1.8" fill="#fff4d6"/>
        </g>
        <g class="carriage-w">
        <circle cx="45" cy="52" r="7" fill="none" stroke="url(#carriage-g)" stroke-width="2.6"/>
        <path d="M45 46v12M39 52h12M41 48l8 8M49 48l-8 8" stroke="url(#carriage-g)" stroke-width="1.6"/>
        <circle cx="45" cy="52" r="1.8" fill="#fff4d6"/>
        </g>
        <path class="carriage-s" d="M56 14l1.2 3 3 1.2-3 1.2L56 23.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
        <circle class="carriage-s carriage-s2" cx="7" cy="20" r="1.9" fill="#ffe9a3"/>
        <circle class="carriage-s carriage-s3" cx="58" cy="40" r="1.7" fill="#fff"/>
        <circle class="carriage-s carriage-s4" cx="6" cy="40" r="1.5" fill="#ffe9a3"/>
      </g>
    </mask>
  </defs>
  <ellipse class="carriage-x-cast" cx="32" cy="60" rx="15" ry="3" fill="url(#carriage-x-cast-g)"/>
  <circle class="carriage-x-aura" cx="32" cy="32" r="29" fill="url(#carriage-x-aura-g)"/>
  <g class="carriage-x-lift">
    <ellipse class="carriage-ring" cx="32" cy="32" rx="26" ry="25" fill="none" stroke="#ffd979" stroke-width="1.8" opacity=".5"/>
    <g class="carriage-body" filter="url(#carriage-f)">
    <path d="M32 46c-11 0-19-7-19-16 0-9 8-16 19-16s19 7 19 16c0 9-8 16-19 16Z" fill="url(#carriage-c)"/>
    <path d="M32 46c9 0 16-5 18-13-1 10-9 15-18 15Z" fill="#4d1a56" opacity=".5"/>
    <path d="M32 14v32M13 30h38" stroke="url(#carriage-g)" stroke-width="2.4" fill="none"/>
    <path d="M20 17c-4 5-5 12-3 18M44 17c4 5 5 12 3 18" stroke="url(#carriage-g)" stroke-width="2" fill="none" opacity=".85"/>
    <rect x="24" y="24" width="16" height="14" rx="4" fill="#fff4d6" opacity=".85"/>
    <rect x="24" y="24" width="16" height="14" rx="4" fill="none" stroke="url(#carriage-g)" stroke-width="2.4"/>
    <path d="M27 27c-1 1.4-1.6 3-1.6 4.8" stroke="#fff" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M20 16c3-3 7-4.6 11-4.8" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M28 12h8l-4-6Z" fill="url(#carriage-g)"/>
    <circle cx="32" cy="7" r="2.4" fill="#8ee6ff"/>
    <path d="M13 46h38" stroke="url(#carriage-g)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>
    <g class="carriage-w">
    <circle cx="19" cy="52" r="7" fill="none" stroke="url(#carriage-g)" stroke-width="2.6"/>
    <path d="M19 46v12M13 52h12M15 48l8 8M23 48l-8 8" stroke="url(#carriage-g)" stroke-width="1.6"/>
    <circle cx="19" cy="52" r="1.8" fill="#fff4d6"/>
    </g>
    <g class="carriage-w">
    <circle cx="45" cy="52" r="7" fill="none" stroke="url(#carriage-g)" stroke-width="2.6"/>
    <path d="M45 46v12M39 52h12M41 48l8 8M49 48l-8 8" stroke="url(#carriage-g)" stroke-width="1.6"/>
    <circle cx="45" cy="52" r="1.8" fill="#fff4d6"/>
    </g>
    <path class="carriage-s" d="M56 14l1.2 3 3 1.2-3 1.2L56 23.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
    <circle class="carriage-s carriage-s2" cx="7" cy="20" r="1.9" fill="#ffe9a3"/>
    <circle class="carriage-s carriage-s3" cx="58" cy="40" r="1.7" fill="#fff"/>
    <circle class="carriage-s carriage-s4" cx="6" cy="40" r="1.5" fill="#ffe9a3"/>
    <g mask="url(#carriage-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#carriage-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#carriage-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#carriage-x-rim)"/>
      <rect class="carriage-x-shine" x="0" y="-16" width="26" height="96" fill="url(#carriage-x-shine-g)" transform="rotate(18 32 32)"/>
    </g>
  </g>
  <circle class="carriage-x-spark" cx="54" cy="13" r="2" fill="#fde68a" style="animation-delay:0s"/>
  <circle class="carriage-x-spark" cx="10" cy="17" r="1.6" fill="#fde68a" style="animation-delay:0.7s"/>
  <circle class="carriage-x-spark" cx="57" cy="45" r="1.7" fill="#fde68a" style="animation-delay:1.3s"/>
  <circle class="carriage-x-spark" cx="7" cy="43" r="1.5" fill="#fde68a" style="animation-delay:1.9s"/>
  <circle class="carriage-x-spark" cx="32" cy="5" r="1.8" fill="#fde68a" style="animation-delay:2.4s"/>
</svg>
