        </g>
        <circle class="reelsoo-throne-ring" cx="32" cy="31" r="27" fill="none" stroke="#ffd76a" stroke-width="2"/>
        <g class="reelsoo-throne-body" filter="url(#reelsoo-throne-f)">
        <path d="M20 22c0-8 5-13 12-13s12 5 12 13v22H20Z" fill="url(#reelsoo-throne-g)"/>
        <path d="M24 24c0-6 3-10 8-10s8 4 8 10v18H24Z" fill="url(#reelsoo-throne-v)"/>
        <path d="M27 20c-1 2-2 4-2 7" stroke="#fff" stroke-opacity=".4" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M24 36c5 3 11 3 16 0v6H24Z" fill="#6b061c" opacity=".5"/>
        <path d="M32 4l-4 5h8Z" fill="url(#reelsoo-throne-g)"/>
        <circle class="reelsoo-throne-gem" cx="32" cy="18" r="3.4" fill="#7ff5ff"/>
        <path d="M14 26h6v18h-6Z" fill="url(#reelsoo-throne-g)"/>
        <path d="M44 26h6v18h-6Z" fill="url(#reelsoo-throne-g)"/>
        <circle cx="17" cy="24" r="3" fill="#ff4d8d"/>
        <circle cx="47" cy="24" r="3" fill="#38d98a"/>
        <path d="M14 42h36v6H14Z" fill="url(#reelsoo-throne-v)"/>
        <path d="M12 46h40a3 3 0 0 1 3 3v3H9v-3a3 3 0 0 1 3-3Z" fill="url(#reelsoo-throne-g)"/>
        <path d="M9 52h46l3 6H6Z" fill="url(#reelsoo-throne-g)"/>
        <path d="M6 58h52" stroke="#7f5502" stroke-width="2.4" opacity=".5"/>
        <path d="M9 52h46l1 2H8Z" fill="#8a5a03" opacity=".4"/>
        <path d="M16 47h8c-4 1-6 2-7 4Z" fill="#fff" opacity=".3"/>
        </g>
        <circle class="reelsoo-throne-s" cx="9" cy="14" r="2.2" fill="#fff"/>
        <circle class="reelsoo-throne-s reelsoo-throne-s2" cx="55" cy="13" r="1.8" fill="#fff"/>
        <circle class="reelsoo-throne-s reelsoo-throne-s3" cx="58" cy="44" r="1.7" fill="#fff"/>
        <circle class="reelsoo-throne-s reelsoo-throne-s4" cx="6" cy="42" r="1.7" fill="#fff"/>
      </g>
    </mask>
  </defs>
  <ellipse class="reelsoo-throne-x-cast" cx="32" cy="60" rx="15" ry="3" fill="url(#reelsoo-throne-x-cast-g)"/>
  <circle class="reelsoo-throne-x-aura" cx="32" cy="32" r="29" fill="url(#reelsoo-throne-x-aura-g)"/>
  <g class="reelsoo-throne-x-lift">
    <circle cx="32" cy="30" r="30" fill="url(#reelsoo-throne-a)"/>
    <g class="reelsoo-throne-rays" opacity=".55">
    <path d="M32 2l2.6 9h-5.2ZM32 62l2.6-9h-5.2ZM2 32l9-2.6v5.2ZM62 32l-9-2.6v5.2ZM11 11l8 4-4 4ZM53 53l-8-4 4-4ZM53 11l-4 8-4-4ZM11 53l4-8 4 4Z" fill="#ffe9a8"/>
    </g>
    <circle class="reelsoo-throne-ring" cx="32" cy="31" r="27" fill="none" stroke="#ffd76a" stroke-width="2"/>
    <g class="reelsoo-throne-body" filter="url(#reelsoo-throne-f)">
    <path d="M20 22c0-8 5-13 12-13s12 5 12 13v22H20Z" fill="url(#reelsoo-throne-g)"/>
    <path d="M24 24c0-6 3-10 8-10s8 4 8 10v18H24Z" fill="url(#reelsoo-throne-v)"/>
    <path d="M27 20c-1 2-2 4-2 7" stroke="#fff" stroke-opacity=".4" stroke-width="2.6" stroke-linecap="round" fill="none"/>
