<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes bubble-tea-deluxe-wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
    @keyframes bubble-tea-deluxe-boba{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}
    @keyframes bubble-tea-deluxe-tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
    .bubble-tea-deluxe-body{transform-box:fill-box;transform-origin:center bottom;animation:bubble-tea-deluxe-wig 2.2s ease-in-out infinite}
    .bubble-tea-deluxe-b{transform-box:fill-box;transform-origin:center;animation:bubble-tea-deluxe-boba 1.6s ease-in-out infinite}
    .bubble-tea-deluxe-b2{animation-delay:.5s}
    .bubble-tea-deluxe-s{transform-box:fill-box;transform-origin:center;animation:bubble-tea-deluxe-tw 2.3s ease-in-out infinite}
    .bubble-tea-deluxe-s2{animation-delay:.8s}
    .bubble-tea-deluxe-s3{animation-delay:1.5s}
    @keyframes bubble-tea-deluxe-x-lift{0%,100%{transform:translateY(1.8px) rotate(-.6deg)}50%{transform:translateY(-1.8px) rotate(.6deg)}}
    @keyframes bubble-tea-deluxe-x-shine{0%{transform:translateX(-78px)}55%,100%{transform:translateX(78px)}}
    @keyframes bubble-tea-deluxe-x-spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
    @keyframes bubble-tea-deluxe-x-aura{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
    @keyframes bubble-tea-deluxe-x-cast{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.86);opacity:.32}}
    .bubble-tea-deluxe-x-lift{transform-box:fill-box;transform-origin:center;animation:bubble-tea-deluxe-x-lift 3.4s ease-in-out infinite}
    .bubble-tea-deluxe-x-shine{animation:bubble-tea-deluxe-x-shine 4.5s cubic-bezier(.5,0,.5,1) infinite}
    .bubble-tea-deluxe-x-spark{transform-box:fill-box;transform-origin:center;animation:bubble-tea-deluxe-x-spark 2.2s ease-in-out infinite}
    .bubble-tea-deluxe-x-aura{transform-box:fill-box;transform-origin:center;animation:bubble-tea-deluxe-x-aura 3s ease-in-out infinite}
    .bubble-tea-deluxe-x-cast{transform-box:fill-box;transform-origin:center;animation:bubble-tea-deluxe-x-cast 3.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.bubble-tea-deluxe-x-lift,.bubble-tea-deluxe-x-shine,.bubble-tea-deluxe-x-spark,.bubble-tea-deluxe-x-aura,.bubble-tea-deluxe-x-cast{animation:none}}
  </style>
  <defs>
    <linearGradient id="bubble-tea-deluxe-gt" x1="18" y1="24" x2="46" y2="56" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#e4bb8c"/><stop offset=".5" stop-color="#c4874f"/><stop offset="1" stop-color="#8a5322"/>
    </linearGradient>
    <linearGradient id="bubble-tea-deluxe-gs" x1="20" y1="14" x2="46" y2="26" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#ffc94d"/><stop offset="1" stop-color="#d98f00"/>
    </linearGradient>
    <filter id="bubble-tea-deluxe-f" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bubble-tea-deluxe-x-aura-g" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#e9d5ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#e9d5ff" stop-opacity="0.1"/>
    </radialGradient>
