        <circle class="bubble-tea-deluxe-s bubble-tea-deluxe-s2" cx="10" cy="30" r="1.7" fill="#ffe6a1"/>
        <circle class="bubble-tea-deluxe-s bubble-tea-deluxe-s3" cx="54" cy="45" r="1.5" fill="#fff"/>
      </g>
