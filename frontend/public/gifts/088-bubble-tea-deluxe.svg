    <circle class="bubble-tea-deluxe-s bubble-tea-deluxe-s3" cx="54" cy="45" r="1.5" fill="#fff"/>
    <g mask="url(#bubble-tea-deluxe-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#bubble-tea-deluxe-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#bubble-tea-deluxe-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#bubble-tea-deluxe-x-rim)"/>
      <rect class="bubble-tea-deluxe-x-shine" x="0" y="-16" width="26" height="96" fill="url(#bubble-tea-deluxe-x-shine-g)" transform="rotate(18 32 32)"/>
    </g>
