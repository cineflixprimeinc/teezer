        <rect x="38" y="6" width="4.6" height="18" rx="2.2" fill="url(#bubble-tea-deluxe-gs)" transform="rotate(12 40 15)"/>
        <path d="M19 26h26l-2.6 28.4A3.6 3.6 0 0 1 38.8 58H25.2a3.6 3.6 0 0 1-3.6-3.6L19 26Z" fill="url(#bubble-tea-deluxe-gt)"/>
        <path d="M21.4 46h21.2l-.8 8.4a3.6 3.6 0 0 1-3.8 3.6H25.2a3.6 3.6 0 0 1-3.6-3.6L21.4 46Z" fill="#5f3410" opacity=".4"/>
        <g class="bubble-tea-deluxe-b">
