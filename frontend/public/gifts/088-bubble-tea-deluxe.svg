        <rect x="16.5" y="21" width="31" height="6.5" rx="3.2" fill="#ffe9c2"/>
        <rect x="16.5" y="21" width="31" height="3" rx="1.5" fill="#fff" opacity=".55"/>
        <path d="M22.5 32c-1 6-1.4 12-1 19" stroke="#fff" stroke-opacity=".28" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <circle cx="41" cy="9" r="2.6" fill="#ffe27a"/>
        </g>
