<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes white-tiger-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
    @keyframes white-tiger-eye{0%,100%{opacity:.55;filter:drop-shadow(0 0 1px #35c8ff)}50%{opacity:1;filter:drop-shadow(0 0 4px #7ae2ff)}}
    @keyframes white-tiger-tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
    .white-tiger-b{transform-box:fill-box;transform-origin:center;animation:white-tiger-pulse 2s ease-in-out infinite}
    .white-tiger-e{transform-box:fill-box;transform-origin:center;animation:white-tiger-eye 1.6s ease-in-out infinite}
    .white-tiger-s{transform-box:fill-box;transform-origin:center;animation:white-tiger-tw 2.2s ease-in-out infinite}
    .white-tiger-s2{animation-delay:.9s}.white-tiger-s3{animation-delay:1.6s}
    @keyframes white-tiger-x-lift{0%,100%{transform:translateY(2.1px) rotate(-.6deg)}50%{transform:translateY(-2.1px) rotate(.6deg)}}
    @keyframes white-tiger-x-shine{0%{transform:translateX(-78px)}55%,100%{transform:translateX(78px)}}
    @keyframes white-tiger-x-spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
    @keyframes white-tiger-x-aura{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
    @keyframes white-tiger-x-cast{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.86);opacity:.32}}
    .white-tiger-x-lift{transform-box:fill-box;transform-origin:center;animation:white-tiger-x-lift 3.4s ease-in-out infinite}
    .white-tiger-x-shine{animation:white-tiger-x-shine 4s cubic-bezier(.5,0,.5,1) infinite}
    .white-tiger-x-spark{transform-box:fill-box;transform-origin:center;animation:white-tiger-x-spark 2.2s ease-in-out infinite}
    .white-tiger-x-aura{transform-box:fill-box;transform-origin:center;animation:white-tiger-x-aura 3s ease-in-out infinite}
    .white-tiger-x-cast{transform-box:fill-box;transform-origin:center;animation:white-tiger-x-cast 3.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.white-tiger-x-lift,.white-tiger-x-shine,.white-tiger-x-spark,.white-tiger-x-aura,.white-tiger-x-cast{animation:none}}
  </style>
  <defs>
    <radialGradient id="white-tiger-g" cx=".35" cy=".28" r=".8">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e2f1fb"/><stop offset="1" stop-color="#9dbdd6"/>
    </radialGradient>
    <filter id="white-tiger-f" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="white-tiger-cp"><path d="M32 10c12 0 20 8 20 20s-9 22-20 22-20-10-20-22 8-20 20-20Z"/></clipPath>
    <radialGradient id="white-tiger-x-aura-g" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#fbcfe8" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbcfe8" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="white-tiger-x-gloss" x1="18" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.58"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
