      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="white-tiger-x-white" x="-20%" y="-20%" width="140%" height="140%">
