      <stop offset="1" stop-color="#0b1020" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="white-tiger-x-rim" x1="44" y1="52" x2="26" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbcfe8" stop-opacity="0.48"/>
      <stop offset=".6" stop-color="#fbcfe8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="white-tiger-x-shine-g" x1="0" y1="0" x2="26" y2="16" gradientUnits="userSpaceOnUse">
