    <circle class="white-tiger-s white-tiger-s2" cx="7" cy="28" r="1.5" fill="#cfeeff"/>
    <circle class="white-tiger-s white-tiger-s3" cx="55" cy="50" r="1.5" fill="#fff"/>
    <g mask="url(#white-tiger-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#white-tiger-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#white-tiger-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#white-tiger-x-rim)"/>
      <rect class="white-tiger-x-shine" x="0" y="-16" width="26" height="96" fill="url(#white-tiger-x-shine-g)" transform="rotate(18 32 32)"/>
