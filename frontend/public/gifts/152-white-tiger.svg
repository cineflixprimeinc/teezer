    <path d="M32 43v3M32 46c-1.4 2-4 2-5.5.5M32 46c1.4 2 4 2 5.5.5" stroke="#3c4b5c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M17 40l-6-2M17 44l-6 2M47 40l6-2M47 44l6 2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
    <g class="white-tiger-e">
    <ellipse cx="24" cy="30" rx="4" ry="3.4" fill="#2ec3f5"/><ellipse cx="40" cy="30" rx="4" ry="3.4" fill="#2ec3f5"/>
    <ellipse cx="24" cy="30" rx="1.5" ry="3" fill="#12314a"/><ellipse cx="40" cy="30" rx="1.5" ry="3" fill="#12314a"/>
    <circle cx="22.6" cy="28.6" r="1.1" fill="#fff"/><circle cx="38.6" cy="28.6" r="1.1" fill="#fff"/>
    </g>
    </g>
