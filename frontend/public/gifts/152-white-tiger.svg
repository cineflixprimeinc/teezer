    <path d="M15 15l1.6 6.4 5-2.5Z" fill="#f0a9c0"/><path d="M49 15l-1.6 6.4-5-2.5Z" fill="#f0a9c0"/>
    <path d="M32 10c12 0 20 8 20 20s-9 22-20 22-20-10-20-22 8-20 20-20Z" fill="url(#white-tiger-g)"/>
    <g clip-path="url(#white-tiger-cp)">
    <path d="M32 10v9M25 12l-2 7M39 12l2 7M14 24l8 3M50 24l-8 3M13 33l9 1M51 33l-9 1M15 42l8-3M49 42l-8-3" stroke="#22303f" stroke-width="2.6" stroke-linecap="round" fill="none"/>
