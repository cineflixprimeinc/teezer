        <path d="M22 36c-2 6-3 12-3 18M32 34v20M42 36c2 6 3 12 3 18" stroke="#2f8f4e" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M24 40c-4-1-7-4-8-8 5-1 9 1 11 5Z" fill="#37a85c"/>
