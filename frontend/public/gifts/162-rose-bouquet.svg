    <circle class="rose-bouquet-s rose-bouquet-s2" cx="8" cy="16" r="1.9" fill="#ffe9a3"/>
    <circle class="rose-bouquet-s rose-bouquet-s3" cx="55" cy="44" r="1.7" fill="#fff"/>
    <circle class="rose-bouquet-s rose-bouquet-s4" cx="9" cy="47" r="1.5" fill="#ffe9a3"/>
    <g mask="url(#rose-bouquet-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#rose-bouquet-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#rose-bouquet-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#rose-bouquet-x-rim)"/>
      <rect class="rose-bouquet-x-shine" x="0" y="-16" width="26" height="96" fill="url(#rose-bouquet-x-shine-g)" transform="rotate(18 32 32)"/>
    </g>
  </g>
  <circle class="rose-bouquet-x-spark" cx="54" cy="13" r="2" fill="#fde68a" style="animation-delay:0s"/>
  <circle class="rose-bouquet-x-spark" cx="10" cy="17" r="1.6" fill="#fde68a" style="animation-delay:0.7s"/>
  <circle class="rose-bouquet-x-spark" cx="57" cy="45" r="1.7" fill="#fde68a" style="animation-delay:1.3s"/>
  <circle class="rose-bouquet-x-spark" cx="7" cy="43" r="1.5" fill="#fde68a" style="animation-delay:1.9s"/>
  <circle class="rose-bouquet-x-spark" cx="32" cy="5" r="1.8" fill="#fde68a" style="animation-delay:2.4s"/>
