        <path d="M24 58h16l1.6-5H22.4Z" fill="#7c5409" opacity=".45"/>
        <path d="M21 43c1 4 2 8 3 11" stroke="#fff8dd" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <rect x="22" y="46" width="20" height="4" rx="2" fill="#e8386f"/>
        <circle cx="32" cy="48" r="2.4" fill="#8ee6ff"/>
        </g>
        <path class="rose-bouquet-s" d="M56 12l1.2 3 3 1.2-3 1.2L56 21.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
        <circle class="rose-bouquet-s rose-bouquet-s2" cx="8" cy="16" r="1.9" fill="#ffe9a3"/>
        <circle class="rose-bouquet-s rose-bouquet-s3" cx="55" cy="44" r="1.7" fill="#fff"/>
        <circle class="rose-bouquet-s rose-bouquet-s4" cx="9" cy="47" r="1.5" fill="#ffe9a3"/>
      </g>
    </mask>
