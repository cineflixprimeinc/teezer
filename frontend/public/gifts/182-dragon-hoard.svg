  <ellipse class="dragon-hoard-x-cast" cx="32" cy="60" rx="15" ry="3" fill="url(#dragon-hoard-x-cast-g)"/>
  <circle class="dragon-hoard-x-aura" cx="32" cy="32" r="29" fill="url(#dragon-hoard-x-aura-g)"/>
  <g class="dragon-hoard-x-lift">
    <ellipse class="dragon-hoard-aura" cx="32" cy="38" rx="27" ry="22" fill="url(#dragon-hoard-a)"/>
    <g filter="url(#dragon-hoard-f)">
    <path d="M22 32c-6-4-9-10-8-16 4 3 8 3 12 1-2 6-1 11 4 15Z" fill="url(#dragon-hoard-b)"/>
    <path d="M42 32c6-4 9-10 8-16-4 3-8 3-12 1 2 6 1 11-4 15Z" fill="url(#dragon-hoard-b)"/>
    <path d="M32 8c7 0 12 6 12 13 0 6-5 11-12 11s-12-5-12-11c0-7 5-13 12-13Z" fill="url(#dragon-hoard-b)"/>
    <path d="M24 12c-2 2-3 5-3 8" stroke="#fff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle class="dragon-hoard-eye" cx="27" cy="21" r="2.4" fill="#ffe14d"/>
    <circle class="dragon-hoard-eye" cx="37" cy="21" r="2.4" fill="#ffe14d"/>
    <path d="M6 54c2-10 10-16 26-16s24 6 26 16Z" fill="url(#dragon-hoard-g)"/>
    <g clip-path="url(#dragon-hoard-c)">
    <circle cx="16" cy="48" r="4" fill="#ffe796" opacity=".9"/>
    <circle cx="30" cy="45" r="4.5" fill="#fff3c0" opacity=".9"/>
    <circle cx="45" cy="49" r="4" fill="#ffe796" opacity=".9"/>
    <path d="M36 40l4 5-4 5-4-5Z" fill="#7ee8ff"/>
    <path d="M22 42l3 4-3 4-3-4Z" fill="#ff8ad4"/>
    <path d="M6 54h52v4H6Z" fill="#8a5a03" opacity=".4"/>
    <rect class="dragon-hoard-sh" x="6" y="36" width="7" height="22" fill="#fff" opacity=".5"/>
    </g>
    </g>
    <circle class="dragon-hoard-s" cx="53" cy="16" r="2.1" fill="#fff"/>
    <circle class="dragon-hoard-s dragon-hoard-s2" cx="10" cy="20" r="1.6" fill="#fff"/>
    <circle class="dragon-hoard-s dragon-hoard-s3" cx="56" cy="36" r="1.7" fill="#fff"/>
    <circle class="dragon-hoard-s dragon-hoard-s4" cx="8" cy="40" r="1.5" fill="#fff"/>
    <g mask="url(#dragon-hoard-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#dragon-hoard-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#dragon-hoard-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#dragon-hoard-x-rim)"/>
      <rect class="dragon-hoard-x-shine" x="0" y="-16" width="26" height="96" fill="url(#dragon-hoard-x-shine-g)" transform="rotate(18 32 32)"/>
    </g>
  </g>
  <circle class="dragon-hoard-x-spark" cx="54" cy="13" r="2" fill="#fde68a" style="animation-delay:0s"/>
  <circle class="dragon-hoard-x-spark" cx="10" cy="17" r="1.6" fill="#fde68a" style="animation-delay:0.7s"/>
  <circle class="dragon-hoard-x-spark" cx="57" cy="45" r="1.7" fill="#fde68a" style="animation-delay:1.3s"/>
  <circle class="dragon-hoard-x-spark" cx="7" cy="43" r="1.5" fill="#fde68a" style="animation-delay:1.9s"/>
  <circle class="dragon-hoard-x-spark" cx="32" cy="5" r="1.8" fill="#fde68a" style="animation-delay:2.4s"/>
</svg>
