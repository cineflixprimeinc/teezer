        <path d="M52 6c4-1 6 1 5 5-1 3-2 5-4 7l-6-6c2-3 3-5 5-6Z" fill="url(#private-jet-g)"/>
        <circle cx="49" cy="14" r="3" fill="#39aee0"/>
        <circle cx="43" cy="20" r="2.4" fill="#39aee0"/>
        <circle cx="37" cy="26" r="2" fill="#39aee0"/>
        <path d="M50 9c1.6-1 3.2-1.2 4.4-.6" stroke="#fff" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M24 36c-1.6 1.6-2.6 3.4-3 5.4" stroke="#fff" stroke-opacity=".6" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M26 15h9l3 2h-11Z" fill="url(#private-jet-g)" opacity=".9"/>
        </g>
        <path class="private-jet-s" d="M12 12l1.3 3.2 3.2 1.3-3.2 1.3L12 21l-1.3-3.2L7.5 16.5l3.2-1.3Z" fill="#fff"/>
        <circle class="private-jet-s private-jet-s2" cx="58" cy="30" r="1.9" fill="#ffe9a3"/>
        <circle class="private-jet-s private-jet-s3" cx="54" cy="48" r="1.7" fill="#fff"/>
        <circle class="private-jet-s private-jet-s4" cx="24" cy="8" r="1.5" fill="#a8e8ff"/>
      </g>
    </mask>
  </defs>
  <ellipse class="private-jet-x-cast" cx="32" cy="60" rx="15" ry="3" fill="url(#private-jet-x-cast-g)"/>
  <circle class="private-jet-x-aura" cx="32" cy="32" r="29" fill="url(#private-jet-x-aura-g)"/>
  <g class="private-jet-x-lift">
