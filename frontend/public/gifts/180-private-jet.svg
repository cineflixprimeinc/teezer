        <path class="private-jet-t" d="M6 58c6-4 11-9 15-14" stroke="#cfe8ff" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".8"/>
        <path class="private-jet-t private-jet-t2" d="M10 60c5-3 9-6 12-10" stroke="#ffe9a3" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".7"/>
        <path class="private-jet-t private-jet-t3" d="M4 52c5-3 9-6 12-9" stroke="#a8e8ff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".6"/>
        <g class="private-jet-body" filter="url(#private-jet-f)">
        <path d="M52 6c4-1 6 1 5 5-1 4-4 8-9 12L28 42l-8 2 2-8 19-19c4-5 8-8 11-9Z" fill="url(#private-jet-b)"/>
        <path d="M57 11c-1 4-4 8-9 12L28 42l-8 2 30-14c4-2 6-6 7-9Z" fill="#7f8fa6" opacity=".5"/>
        <path d="M41 15 22 12l-6 5 16 6Z" fill="url(#private-jet-b)"/>
