    <path class="mega-yacht-w mega-yacht-w2" d="M32 59c5-3 9-3 14 0 4 2.4 7 2.8 14 0" stroke="url(#mega-yacht-sea)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path class="mega-yacht-s" d="M56 12l1.2 3 3 1.2-3 1.2L56 21.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
