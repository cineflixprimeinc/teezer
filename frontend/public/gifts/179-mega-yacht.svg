        <path d="M18 24h26l-1 2.2H19Z" fill="url(#mega-yacht-g)"/>
        <path d="M50 44.4 44 54c-1.4 1.6-3 2-5 2h13c2 0 3.6-1.4 4.6-3Z" fill="#7a8ba3" opacity=".45"/>
        <rect x="21" y="27" width="5" height="4" rx="2" fill="#39aee0"/>
        <rect x="29" y="27" width="5" height="4" rx="2" fill="#39aee0"/>
        <rect x="37" y="27" width="4" height="4" rx="2" fill="#39aee0"/>
        <rect x="17" y="37" width="6" height="3.4" rx="1.7" fill="#39aee0"/>
        <rect x="26" y="37" width="6" height="3.4" rx="1.7" fill="#39aee0"/>
        <rect x="35" y="37" width="6" height="3.4" rx="1.7" fill="#39aee0"/>
        <rect x="44" y="37" width="5" height="3.4" rx="1.7" fill="#39aee0"/>
        <path d="M13 46c1.6 5 5 8 10 9" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <path d="M20 25.6c1.4-.8 3-1.2 4.6-1.3" stroke="#fff" stroke-opacity=".8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <circle cx="49" cy="49" r="2.2" fill="url(#mega-yacht-g)"/>
        </g>
        <path class="mega-yacht-w" d="M4 56c5-3 9-3 14 0 5 3 9 3 14 0" stroke="url(#mega-yacht-sea)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path class="mega-yacht-w mega-yacht-w2" d="M32 59c5-3 9-3 14 0 4 2.4 7 2.8 14 0" stroke="url(#mega-yacht-sea)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path class="mega-yacht-s" d="M56 12l1.2 3 3 1.2-3 1.2L56 21.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
        <circle class="mega-yacht-s mega-yacht-s2" cx="8" cy="16" r="1.9" fill="#ffe9a3"/>
        <circle class="mega-yacht-s mega-yacht-s3" cx="58" cy="32" r="1.7" fill="#fff"/>
        <circle class="mega-yacht-s mega-yacht-s4" cx="7" cy="32" r="1.5" fill="#ffe9a3"/>
      </g>
    </mask>
  </defs>
  <ellipse class="mega-yacht-x-cast" cx="32" cy="60" rx="15" ry="3" fill="url(#mega-yacht-x-cast-g)"/>
  <circle class="mega-yacht-x-aura" cx="32" cy="32" r="29" fill="url(#mega-yacht-x-aura-g)"/>
  <g class="mega-yacht-x-lift">
    <ellipse class="mega-yacht-ring" cx="32" cy="32" rx="27" ry="25" fill="none" stroke="#ffd979" stroke-width="1.8" opacity=".5"/>
    <g class="mega-yacht-body" filter="url(#mega-yacht-f)">
    <rect x="24" y="10" width="3" height="14" rx="1.5" fill="url(#mega-yacht-g)"/>
