    <circle class="mega-yacht-s mega-yacht-s4" cx="7" cy="32" r="1.5" fill="#ffe9a3"/>
    <g mask="url(#mega-yacht-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#mega-yacht-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#mega-yacht-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#mega-yacht-x-rim)"/>
      <rect class="mega-yacht-x-shine" x="0" y="-16" width="26" height="96" fill="url(#mega-yacht-x-shine-g)" transform="rotate(18 32 32)"/>
    </g>
  </g>
  <circle class="mega-yacht-x-spark" cx="54" cy="13" r="2" fill="#fde68a" style="animation-delay:0s"/>
  <circle class="mega-yacht-x-spark" cx="10" cy="17" r="1.6" fill="#fde68a" style="animation-delay:0.7s"/>
  <circle class="mega-yacht-x-spark" cx="57" cy="45" r="1.7" fill="#fde68a" style="animation-delay:1.3s"/>
  <circle class="mega-yacht-x-spark" cx="7" cy="43" r="1.5" fill="#fde68a" style="animation-delay:1.9s"/>
  <circle class="mega-yacht-x-spark" cx="32" cy="5" r="1.8" fill="#fde68a" style="animation-delay:2.4s"/>
