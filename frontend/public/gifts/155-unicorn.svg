      <rect x="0" y="0" width="64" height="64" fill="url(#unicorn-x-rim)"/>
      <rect class="unicorn-x-shine" x="0" y="-16" width="26" height="96" fill="url(#unicorn-x-shine-g)" transform="rotate(18 32 32)"/>
