        <path class="unicorn-h unicorn-h2" d="M53 25l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1Z" fill="#ffe6a8"/>
        <path class="unicorn-h unicorn-h3" d="M10 16l1 2.3 2.3 1-2.3 1-1 2.3-1-2.3L6.7 19.3l2.3-1Z" fill="#ffd6f5"/>
      </g>
    </mask>
  </defs>
