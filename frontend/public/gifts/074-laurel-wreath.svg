        <path d="M27 55C15 50 9 39 11 26c1-7 4-12 8-16" stroke="url(#laurel-wreath-g1)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <path d="M37 55c12-5 18-16 16-29-1-7-4-12-8-16" stroke="url(#laurel-wreath-g2)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <g fill="url(#laurel-wreath-g1)">
        <ellipse cx="11" cy="20" rx="5" ry="3" transform="rotate(-40 11 20)"/>
        <ellipse cx="8" cy="31" rx="5.5" ry="3.2" transform="rotate(-12 8 31)"/>
        <ellipse cx="11" cy="42" rx="5.5" ry="3.2" transform="rotate(22 11 42)"/>
        <ellipse cx="19" cy="51" rx="5" ry="3" transform="rotate(48 19 51)"/>
        <ellipse cx="21" cy="16" rx="4.5" ry="2.8" transform="rotate(-58 21 16)"/>
        </g>
        <g fill="url(#laurel-wreath-g2)">
        <ellipse cx="53" cy="20" rx="5" ry="3" transform="rotate(40 53 20)"/>
        <ellipse cx="56" cy="31" rx="5.5" ry="3.2" transform="rotate(12 56 31)"/>
        <ellipse cx="53" cy="42" rx="5.5" ry="3.2" transform="rotate(-22 53 42)"/>
        <ellipse cx="45" cy="51" rx="5" ry="3" transform="rotate(-48 45 51)"/>
        <ellipse cx="43" cy="16" rx="4.5" ry="2.8" transform="rotate(58 43 16)"/>
        </g>
        <path d="M13 21a12 12 0 0 0-2 8" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <path d="M32 22l3 6.5 7 1-5 5 1.2 7-6.2-3.4-6.2 3.4L27 34.5l-5-5 7-1Z" fill="url(#laurel-wreath-g1)"/>
        <path d="M32 26l1.6 3.6 3.7.6-2.7 2.6.7 3.8-3.3-1.9Z" fill="#fff8e0" opacity=".85"/>
        </g>
        <circle class="laurel-wreath-s" cx="32" cy="8" r="2.2" fill="#fff"/>
        <circle class="laurel-wreath-s laurel-wreath-s2" cx="32" cy="56" r="1.6" fill="#ffeaa8"/>
      </g>
    </mask>
  </defs>
  <ellipse class="laurel-wreath-x-cast" cx="32" cy="60" rx="15" ry="3" fill="url(#laurel-wreath-x-cast-g)"/>
  <g class="laurel-wreath-x-lift">
    <g class="laurel-wreath-body">
    <path d="M27 55C15 50 9 39 11 26c1-7 4-12 8-16" stroke="url(#laurel-wreath-g1)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M37 55c12-5 18-16 16-29-1-7-4-12-8-16" stroke="url(#laurel-wreath-g2)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <g fill="url(#laurel-wreath-g1)">
    <ellipse cx="11" cy="20" rx="5" ry="3" transform="rotate(-40 11 20)"/>
    <ellipse cx="8" cy="31" rx="5.5" ry="3.2" transform="rotate(-12 8 31)"/>
    <ellipse cx="11" cy="42" rx="5.5" ry="3.2" transform="rotate(22 11 42)"/>
    <ellipse cx="19" cy="51" rx="5" ry="3" transform="rotate(48 19 51)"/>
    <ellipse cx="21" cy="16" rx="4.5" ry="2.8" transform="rotate(-58 21 16)"/>
    </g>
    <g fill="url(#laurel-wreath-g2)">
    <ellipse cx="53" cy="20" rx="5" ry="3" transform="rotate(40 53 20)"/>
    <ellipse cx="56" cy="31" rx="5.5" ry="3.2" transform="rotate(12 56 31)"/>
    <ellipse cx="53" cy="42" rx="5.5" ry="3.2" transform="rotate(-22 53 42)"/>
    <ellipse cx="45" cy="51" rx="5" ry="3" transform="rotate(-48 45 51)"/>
    <ellipse cx="43" cy="16" rx="4.5" ry="2.8" transform="rotate(58 43 16)"/>
    </g>
    <path d="M13 21a12 12 0 0 0-2 8" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M32 22l3 6.5 7 1-5 5 1.2 7-6.2-3.4-6.2 3.4L27 34.5l-5-5 7-1Z" fill="url(#laurel-wreath-g1)"/>
    <path d="M32 26l1.6 3.6 3.7.6-2.7 2.6.7 3.8-3.3-1.9Z" fill="#fff8e0" opacity=".85"/>
    </g>
    <circle class="laurel-wreath-s" cx="32" cy="8" r="2.2" fill="#fff"/>
    <circle class="laurel-wreath-s laurel-wreath-s2" cx="32" cy="56" r="1.6" fill="#ffeaa8"/>
    <g mask="url(#laurel-wreath-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#laurel-wreath-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#laurel-wreath-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#laurel-wreath-x-rim)"/>
      <rect class="laurel-wreath-x-shine" x="0" y="-16" width="26" height="96" fill="url(#laurel-wreath-x-shine-g)" transform="rotate(18 32 32)"/>
    </g>
  </g>
  <circle class="laurel-wreath-x-spark" cx="54" cy="13" r="2" fill="#bae6fd" style="animation-delay:0s"/>
  <circle class="laurel-wreath-x-spark" cx="10" cy="17" r="1.6" fill="#bae6fd" style="animation-delay:0.7s"/>
</svg>
