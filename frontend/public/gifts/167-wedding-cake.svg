        </g>
        <path class="wedding-cake-s" d="M56 24l1.2 3 3 1.2-3 1.2L56 33.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
        <path class="wedding-cake-s wedding-cake-s2" d="M7 26l1.1 2.7 2.7 1.1-2.7 1.1L7 34.6l-1.1-2.7L3.2 30.8l2.7-.9Z" fill="#ffe9a3"/>
