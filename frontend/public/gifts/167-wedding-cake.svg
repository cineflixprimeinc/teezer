<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes wedding-cake-tw{0%,100%{opacity:.18;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes wedding-cake-aura{0%,100%{opacity:.18;transform:scale(.88)}50%{opacity:.58;transform:scale(1.06)}}
    @keyframes wedding-cake-ring{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-2.5px) rotate(6deg)}}
    .wedding-cake-ring-g{transform-box:fill-box;transform-origin:center;animation:wedding-cake-ring 2.4s ease-in-out infinite}
    .wedding-cake-aura{transform-box:fill-box;transform-origin:center;animation:wedding-cake-aura 2.7s ease-in-out infinite}
    .wedding-cake-s{transform-box:fill-box;transform-origin:center;animation:wedding-cake-tw 1.8s ease-in-out infinite}
    .wedding-cake-s2{animation-delay:.45s}.wedding-cake-s3{animation-delay:.9s}.wedding-cake-s4{animation-delay:1.35s}
    @keyframes wedding-cake-x-lift{0%,100%{transform:translateY(2.4px) rotate(-.6deg)}50%{transform:translateY(-2.4px) rotate(.6deg)}}
    @keyframes wedding-cake-x-shine{0%{transform:translateX(-78px)}55%,100%{transform:translateX(78px)}}
    @keyframes wedding-cake-x-spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
    @keyframes wedding-cake-x-aura{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
    @keyframes wedding-cake-x-cast{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.86);opacity:.32}}
    .wedding-cake-x-lift{transform-box:fill-box;transform-origin:center;animation:wedding-cake-x-lift 3.4s ease-in-out infinite}
    .wedding-cake-x-shine{animation:wedding-cake-x-shine 3.5s cubic-bezier(.5,0,.5,1) infinite}
    .wedding-cake-x-spark{transform-box:fill-box;transform-origin:center;animation:wedding-cake-x-spark 2.2s ease-in-out infinite}
    .wedding-cake-x-aura{transform-box:fill-box;transform-origin:center;animation:wedding-cake-x-aura 3s ease-in-out infinite}
    .wedding-cake-x-cast{transform-box:fill-box;transform-origin:center;animation:wedding-cake-x-cast 3.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.wedding-cake-x-lift,.wedding-cake-x-shine,.wedding-cake-x-spark,.wedding-cake-x-aura,.wedding-cake-x-cast{animation:none}}
  </style>
  <defs>
    <linearGradient id="wedding-cake-w" x1="12" y1="24" x2="52" y2="58" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f3e7e2"/><stop offset="1" stop-color="#c4aca6"/>
    </linearGradient>
    <linearGradient id="wedding-cake-g" x1="10" y1="16" x2="54" y2="56" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff5c8"/><stop offset=".5" stop-color="#f2c542"/><stop offset="1" stop-color="#a1710f"/>
    </linearGradient>
    <filter id="wedding-cake-f" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
