        <path d="M20 39h24l-2 4H22Z" fill="url(#giant-teddy-g)"/>
        <path d="M24 39c0-2 1.6-3.6 3.6-3.6 2 0 3.4 1.4 4.4 3.6 1-2.2 2.4-3.6 4.4-3.6 2 0 3.6 1.6 3.6 3.6Z" fill="#e23a68"/>
        </g>
        <g class="giant-teddy-heart"><path d="M32 44c-4-2.8-6-4.6-6-7 0-1.9 1.5-3.4 3.3-3.4 1.1 0 2.1.6 2.7 1.5.6-.9 1.6-1.5 2.7-1.5C36.5 33.6 38 35.1 38 37c0 2.4-2 4.2-6 7Z" fill="#ff4d7d"/></g>
        <path class="giant-teddy-s" d="M56 12l1.2 3 3 1.2-3 1.2L56 21.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
        <circle class="giant-teddy-s giant-teddy-s2" cx="7" cy="18" r="1.9" fill="#ffe9a3"/>
        <circle class="giant-teddy-s giant-teddy-s3" cx="58" cy="42" r="1.7" fill="#fff"/>
        <circle class="giant-teddy-s giant-teddy-s4" cx="6" cy="40" r="1.5" fill="#ffe9a3"/>
      </g>
    </mask>
