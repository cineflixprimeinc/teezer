<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    @keyframes giant-teddy-sway{0%,100%{transform:rotate(-5deg) translateY(1px)}50%{transform:rotate(5deg) translateY(-2px)}}
    @keyframes giant-teddy-aura{0%,100%{opacity:.18;transform:scale(.88)}50%{opacity:.58;transform:scale(1.06)}}
    @keyframes giant-teddy-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
    @keyframes giant-teddy-tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
    .giant-teddy-body{transform-box:fill-box;transform-origin:50% 92%;animation:giant-teddy-sway 2.8s ease-in-out infinite}
    .giant-teddy-ring{transform-box:fill-box;transform-origin:center;animation:giant-teddy-aura 2.6s ease-in-out infinite}
    .giant-teddy-heart{transform-box:fill-box;transform-origin:center;animation:giant-teddy-beat 1.6s ease-in-out infinite}
    .giant-teddy-s{transform-box:fill-box;transform-origin:center;animation:giant-teddy-tw 2.1s ease-in-out infinite}
    .giant-teddy-s2{animation-delay:.5s}.giant-teddy-s3{animation-delay:1s}.giant-teddy-s4{animation-delay:1.5s}
    @keyframes giant-teddy-x-lift{0%,100%{transform:translateY(2.4px) rotate(-.6deg)}50%{transform:translateY(-2.4px) rotate(.6deg)}}
    @keyframes giant-teddy-x-shine{0%{transform:translateX(-78px)}55%,100%{transform:translateX(78px)}}
    @keyframes giant-teddy-x-spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
    @keyframes giant-teddy-x-aura{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
    @keyframes giant-teddy-x-cast{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.86);opacity:.32}}
    .giant-teddy-x-lift{transform-box:fill-box;transform-origin:center;animation:giant-teddy-x-lift 3.4s ease-in-out infinite}
    .giant-teddy-x-shine{animation:giant-teddy-x-shine 3.5s cubic-bezier(.5,0,.5,1) infinite}
    .giant-teddy-x-spark{transform-box:fill-box;transform-origin:center;animation:giant-teddy-x-spark 2.2s ease-in-out infinite}
    .giant-teddy-x-aura{transform-box:fill-box;transform-origin:center;animation:giant-teddy-x-aura 3s ease-in-out infinite}
    .giant-teddy-x-cast{transform-box:fill-box;transform-origin:center;animation:giant-teddy-x-cast 3.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.giant-teddy-x-lift,.giant-teddy-x-shine,.giant-teddy-x-spark,.giant-teddy-x-aura,.giant-teddy-x-cast{animation:none}}
  </style>
  <defs>
    <radialGradient id="giant-teddy-b" cx=".35" cy=".28" r=".85">
    <stop offset="0" stop-color="#f0cfa6"/><stop offset=".55" stop-color="#c68d55"/><stop offset="1" stop-color="#7d4f26"/>
    </radialGradient>
    <linearGradient id="giant-teddy-g" x1="18" y1="6" x2="46" y2="24" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff5c8"/><stop offset=".5" stop-color="#f2c542"/><stop offset="1" stop-color="#a1710f"/>
    </linearGradient>
    <filter id="giant-teddy-f" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="giant-teddy-x-aura-g" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="giant-teddy-x-gloss" x1="18" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.64"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="giant-teddy-x-shade" x1="32" y1="30" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="giant-teddy-x-rim" x1="44" y1="52" x2="26" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset=".6" stop-color="#fde68a" stop-opacity="0"/>
