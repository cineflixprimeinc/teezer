        <circle cx="25.2" cy="22.2" r=".9" fill="#fff"/><circle cx="37.2" cy="22.2" r=".9" fill="#fff"/>
        <path d="M22 15c2-3 5-4.6 8-4.8" stroke="#fff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round" fill="none"/>
