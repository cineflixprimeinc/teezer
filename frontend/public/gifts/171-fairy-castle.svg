        <g class="fairy-castle-body" filter="url(#fairy-castle-f)">
        <rect x="10" y="34" width="10" height="24" rx="3" fill="url(#fairy-castle-w)"/>
        <rect x="44" y="34" width="10" height="24" rx="3" fill="url(#fairy-castle-w)"/>
        <rect x="20" y="40" width="24" height="18" rx="3" fill="url(#fairy-castle-w)"/>
        <rect x="25" y="18" width="14" height="26" rx="4" fill="url(#fairy-castle-w)"/>
        <path d="M15 24l6 11H9Z" fill="url(#fairy-castle-r)"/>
        <path d="M49 24l6 11H43Z" fill="url(#fairy-castle-r)"/>
        <path d="M32 4l9 15H23Z" fill="url(#fairy-castle-r)"/>
