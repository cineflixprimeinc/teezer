        <path d="M27 50h10v8H27Z" fill="#f2c542"/>
        <path d="M27 52c0-2.8 2.2-5 5-5s5 2.2 5 5Z" fill="#f2c542"/>
        <path d="M29 52.5h6v5.5h-6Z" fill="#a1710f" opacity=".55"/>
        <rect class="fairy-castle-win" x="29.5" y="24" width="5" height="7" rx="2.5" fill="#ffe27a"/>
        <rect class="fairy-castle-win fairy-castle-win2" x="12.5" y="40" width="5" height="6" rx="2.5" fill="#ffe27a"/>
        <rect class="fairy-castle-win fairy-castle-win3" x="46.5" y="40" width="5" height="6" rx="2.5" fill="#ffe27a"/>
        <circle cx="32" cy="35" r="2.4" fill="#8ee6ff"/>
        <path d="M32 2v3M15 21v3M49 21v3" stroke="#f2c542" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M32 2l5 2-5 2Z" fill="#e754a8"/><path d="M15 21l4 1.6-4 1.6Z" fill="#e754a8"/>
        <path d="M49 21l4 1.6-4 1.6Z" fill="#e754a8"/>
        </g>
        <path class="fairy-castle-s" d="M56 14l1.2 3 3 1.2-3 1.2L56 23.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
        <circle class="fairy-castle-s fairy-castle-s2" cx="7" cy="20" r="1.9" fill="#ffe9a3"/>
        <circle class="fairy-castle-s fairy-castle-s3" cx="58" cy="30" r="1.7" fill="#fff"/>
        <circle class="fairy-castle-s fairy-castle-s4" cx="6" cy="12" r="1.5" fill="#d9c2ff"/>
      </g>
    </mask>
  </defs>
  <ellipse class="fairy-castle-x-cast" cx="32" cy="60" rx="15" ry="3" fill="url(#fairy-castle-x-cast-g)"/>
  <circle class="fairy-castle-x-aura" cx="32" cy="32" r="29" fill="url(#fairy-castle-x-aura-g)"/>
  <g class="fairy-castle-x-lift">
    <circle class="fairy-castle-ring" cx="32" cy="34" r="27" fill="url(#fairy-castle-a)"/>
    <g class="fairy-castle-body" filter="url(#fairy-castle-f)">
    <rect x="10" y="34" width="10" height="24" rx="3" fill="url(#fairy-castle-w)"/>
    <rect x="44" y="34" width="10" height="24" rx="3" fill="url(#fairy-castle-w)"/>
    <rect x="20" y="40" width="24" height="18" rx="3" fill="url(#fairy-castle-w)"/>
    <rect x="25" y="18" width="14" height="26" rx="4" fill="url(#fairy-castle-w)"/>
    <path d="M15 24l6 11H9Z" fill="url(#fairy-castle-r)"/>
    <path d="M49 24l6 11H43Z" fill="url(#fairy-castle-r)"/>
    <path d="M32 4l9 15H23Z" fill="url(#fairy-castle-r)"/>
    <path d="M12 36c0-4 1.4-7 3-9-.6 4-.6 7 0 9Z" fill="#fff" opacity=".4"/>
    <path d="M27 22c0-2.6 1.4-5 3-6.6-1 3.6-1.4 6.6-1 9Z" fill="#fff" opacity=".45"/>
    <path d="M10 52h10M44 52h10M20 52h24" stroke="#7d8ac0" stroke-width="2" opacity=".35"/>
    <path d="M27 50h10v8H27Z" fill="#f2c542"/>
    <path d="M27 52c0-2.8 2.2-5 5-5s5 2.2 5 5Z" fill="#f2c542"/>
    <path d="M29 52.5h6v5.5h-6Z" fill="#a1710f" opacity=".55"/>
    <rect class="fairy-castle-win" x="29.5" y="24" width="5" height="7" rx="2.5" fill="#ffe27a"/>
    <rect class="fairy-castle-win fairy-castle-win2" x="12.5" y="40" width="5" height="6" rx="2.5" fill="#ffe27a"/>
    <rect class="fairy-castle-win fairy-castle-win3" x="46.5" y="40" width="5" height="6" rx="2.5" fill="#ffe27a"/>
    <circle cx="32" cy="35" r="2.4" fill="#8ee6ff"/>
    <path d="M32 2v3M15 21v3M49 21v3" stroke="#f2c542" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M32 2l5 2-5 2Z" fill="#e754a8"/><path d="M15 21l4 1.6-4 1.6Z" fill="#e754a8"/>
    <path d="M49 21l4 1.6-4 1.6Z" fill="#e754a8"/>
    </g>
    <path class="fairy-castle-s" d="M56 14l1.2 3 3 1.2-3 1.2L56 23.4l-1.2-3-3-1.2 3-1.2Z" fill="#fff"/>
    <circle class="fairy-castle-s fairy-castle-s2" cx="7" cy="20" r="1.9" fill="#ffe9a3"/>
    <circle class="fairy-castle-s fairy-castle-s3" cx="58" cy="30" r="1.7" fill="#fff"/>
    <circle class="fairy-castle-s fairy-castle-s4" cx="6" cy="12" r="1.5" fill="#d9c2ff"/>
    <g mask="url(#fairy-castle-x-mask)">
      <rect x="0" y="0" width="64" height="64" fill="url(#fairy-castle-x-shade)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#fairy-castle-x-gloss)"/>
      <rect x="0" y="0" width="64" height="64" fill="url(#fairy-castle-x-rim)"/>
      <rect class="fairy-castle-x-shine" x="0" y="-16" width="26" height="96" fill="url(#fairy-castle-x-shine-g)" transform="rotate(18 32 32)"/>
    </g>
  </g>
  <circle class="fairy-castle-x-spark" cx="54" cy="13" r="2" fill="#fde68a" style="animation-delay:0s"/>
  <circle class="fairy-castle-x-spark" cx="10" cy="17" r="1.6" fill="#fde68a" style="animation-delay:0.7s"/>
  <circle class="fairy-castle-x-spark" cx="57" cy="45" r="1.7" fill="#fde68a" style="animation-delay:1.3s"/>
  <circle class="fairy-castle-x-spark" cx="7" cy="43" r="1.5" fill="#fde68a" style="animation-delay:1.9s"/>
  <circle class="fairy-castle-x-spark" cx="32" cy="5" r="1.8" fill="#fde68a" style="animation-delay:2.4s"/>
</svg>
